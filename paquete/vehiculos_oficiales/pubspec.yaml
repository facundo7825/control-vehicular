name: vehiculos_oficiales
description: "Módulo Vehículos Oficiales para la app del Poder Judicial (solicitantes y choferes)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.7.1
  clock: ^1.1.2
  crypto: ^3.0.7
  dart_pusher_channels: ^1.3.1
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  flutter_map: ^8.3.2
  flutter_map_cache: ^2.1.0
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^17.5.0
  google_maps_flutter: ^2.18.1
  http_cache_file_store: ^2.0.2
  http_parser: ^4.1.2
  intl: ^0.20.2
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  # Avisos con sonido (generados por scripts/generar-sonidos.dart).
  assets:
    - assets/sonidos/
